<style>
/* Layout: app de una columna con barra de pestañas abajo (Hoy, Explorar, Guardados, Ajustes); cada rubro tiene su color */
:root{
  --bg:#f3f4fa; --surface:#ffffff; --ink:#1a1530; --muted:#625d7a; --line:#e3e1ef; --soft:#eeedf7;
  --head:#1a1530; --hot:#ff3d7f; --sun:#ffd23f; --ok:#0a8f5a; --warn:#b85c00;
  --display:"Unbounded",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0d1a; --surface:#1b1830; --ink:#f1effa; --muted:#a7a2c2; --line:#2e2a48; --soft:#24203b;
  --head:#07060d; --hot:#ff5b93; --sun:#ffd23f; --ok:#4fe0a0; --warn:#ffb15c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0d1a; --surface:#1b1830; --ink:#f1effa; --muted:#a7a2c2; --line:#2e2a48; --soft:#24203b;
  --head:#07060d; --hot:#ff5b93; --sun:#ffd23f; --ok:#4fe0a0; --warn:#ffb15c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}

/* cabecera */
.hero{background:var(--head);color:#fff;padding-inline:16px;padding-block:14px 0}
.hero-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px}
h1{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h1 .pc{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--hot);color:#fff;font-size:.95rem;transform:rotate(-8deg)}
h1 em{font-style:normal;color:var(--sun)}
.pills{display:flex;gap:6px;min-width:0}
.pill{border:0;border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.pill.loc{background:var(--sun);color:#1a1530}
.stripe{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:5px}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--hot)}
.tab .badge{position:absolute;margin-left:22px;margin-top:-4px;background:var(--hot);color:#fff;font-size:.62rem;border-radius:999px;padding:0 5px}
.view{padding-block:16px 24px}

/* Hoy */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px 6px;margin-inline:-16px;padding-inline:16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 12px;min-width:66px;text-align:center;cursor:pointer;display:grid;gap:1px}
.day b{font-size:.85rem}
.day small{font-size:.7rem;color:var(--muted);font-weight:600}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.greet{margin:14px 2px 4px;font-family:var(--display);font-size:1.25rem;line-height:1.2;text-wrap:balance}
.greet em{font-style:normal;color:var(--hot)}
.sub{margin:0 2px 12px;color:var(--muted);font-size:.9rem}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px 8px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:.85rem;font-weight:600;padding:7px 13px;border-radius:999px;border:2px solid var(--c,var(--line));background:var(--surface);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.chip .n{font-size:.72rem;opacity:.7}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:var(--ci,var(--bg));border-color:var(--c,var(--ink))}
.chip[aria-pressed="true"] .dot{background:var(--ci,var(--bg))}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 2px 10px}
.sec h2{margin:0;font-family:var(--display);font-size:.98rem;font-weight:600}
.sec span{font-size:.8rem;color:var(--muted)}
.list{display:grid;gap:10px}
.more{margin-top:10px;width:100%;border:2px dashed var(--line);background:none;border-radius:16px;padding:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.callout{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--soft);font-size:.88rem;display:grid;gap:8px}
.callout b{font-size:.95rem}
.linkbtn{border:0;background:none;padding:0;color:var(--hot);font-weight:700;cursor:pointer;text-align:left}

/* tarjeta de descuento */
.deal{display:grid;grid-template-columns:76px 1fr;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;width:100%;padding:0}
.deal .pc{display:grid;place-items:center;align-content:center;gap:2px;background:var(--c);color:var(--ci);padding:10px 4px;text-align:center}
.deal .pc b{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.deal .pc b.sm{font-size:.82rem}
.deal .pc small{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.9}
.deal .bd{padding:11px 13px;min-width:0;display:grid;gap:5px}
.deal .top{display:flex;gap:9px;align-items:center;min-width:0}
.deal .top span:last-child{min-width:0}
.deal .h3{display:block;margin:0;font-size:.97rem;font-weight:700;line-height:1.28}
.deal .who{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);display:inline-flex;align-items:center;gap:4px}
.tag.hoy{background:var(--sun);color:#1a1530}
.tag.ok{color:var(--ok);background:transparent;border:1.5px solid currentColor}
.tag.chk{color:var(--warn);background:transparent;border:1.5px solid currentColor}
.tag.zone{background:var(--ink);color:var(--bg)}
.tag.mine{background:var(--hot);color:#fff}
.tag.exp{background:var(--hot);color:#fff}
.mono{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.68rem;letter-spacing:-.02em;background:var(--c);color:var(--ci)}
.mono.lg{width:52px;height:52px;border-radius:16px;font-size:.95rem}
.mono.sm{width:20px;height:20px;border-radius:6px;font-size:.5rem}
.mono.img{background:#ffffff;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.mono img{width:100%;height:100%;object-fit:contain;display:block}

/* Explorar */
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px 6px 4px 14px}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;outline:none}
.search:focus-within{border-color:var(--ink)}
.fbtn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.82rem;cursor:pointer;white-space:nowrap}
.fbtn .n{background:var(--hot);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.store{position:relative;display:grid;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;cursor:pointer;overflow:hidden}
.store::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.store b{display:block;font-weight:700;font-size:.93rem;line-height:1.2;overflow-wrap:anywhere}
.store small{display:block;color:var(--muted);font-size:.74rem}
.store .row{display:flex;align-items:center;gap:9px;min-width:0}
.store .row span:last-child{min-width:0}
.store .ft{display:flex;justify-content:space-between;align-items:end;font-size:.76rem;color:var(--muted)}
.store .best{font-family:var(--display);font-weight:800;font-size:.95rem;background:var(--c);color:var(--ci);padding:2px 8px;border-radius:9px}
.shophead{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--c);color:var(--ci);margin-bottom:12px}
.shophead .mono{background:var(--surface);color:var(--ink)}
.shophead b{font-family:var(--display);font-size:1.02rem;display:block}
.shophead span{min-width:0;flex:1}
.shophead a{color:inherit;font-weight:700;font-size:.84rem;white-space:nowrap}
.back{border:0;background:none;padding:0 0 10px;font-weight:700;color:var(--hot);cursor:pointer}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px}

/* hojas (dialogs) */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;border-radius:22px;overflow:auto}
dialog::backdrop{background:rgba(15,13,26,.6)}
@media (max-width:600px){dialog{margin:auto 0 0;border-radius:22px 22px 0 0;max-width:100%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sheet{padding:18px 18px 20px;display:grid;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-size:1.1rem;line-height:1.25}
.sheet .x{position:relative;z-index:2;justify-self:end;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;margin-bottom:-40px}
.big{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--c);color:var(--ci)}
.big .mono:not(.img){background:var(--surface);color:var(--ink)}
.big b{font-family:var(--display);font-size:2rem;line-height:1}
.big span{font-size:.85rem;font-weight:600}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.9rem;margin:0}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;min-width:0}
.cond{font-size:.88rem;color:var(--muted);margin:0;background:var(--soft);padding:12px 14px;border-radius:14px}
.calc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;background:var(--soft);padding:10px 14px;border-radius:14px}
.calc input{width:110px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--surface)}
.calc output{font-weight:800;color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--hot);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.grid-dep{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;font-weight:700;font-size:.88rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.opt[aria-pressed="true"]{border-color:var(--hot);background:color-mix(in srgb,var(--hot) 12%,var(--surface))}
.steps{display:flex;gap:6px}
.steps i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--hot)}
.lead{margin:0;color:var(--muted);font-size:.92rem}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);min-width:0;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dchk{display:flex;flex-wrap:wrap;gap:6px 12px}
.dchk label{display:flex;flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-size:.86rem}
.dchk input{width:auto}
.radio{display:grid;gap:8px}
.radio label{display:flex;align-items:center;gap:8px;font-size:.92rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.radio input{accent-color:var(--hot)}
.radio label:has(input:checked){border-color:var(--hot)}

/* Ajustes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.row-set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.row-set:last-child{border-bottom:0}
.row-set span{flex:1;min-width:0}
.row-set b{display:block;font-size:.95rem}
.row-set small{color:var(--muted);font-size:.82rem}
.row-set .go{color:var(--muted);font-weight:800}
.note{margin-top:16px;font-size:.82rem;color:var(--muted)}
.rep{padding:12px 0;border-bottom:1px solid var(--line);font-size:.88rem;display:grid;gap:3px}
.rep:last-child{border-bottom:0}
.rep small{color:var(--muted)}
.logorow{display:flex;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.logorow .nm{flex:1;min-width:0;font-weight:600;font-size:.9rem}
.upl{position:relative;font-size:.8rem;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--soft);cursor:pointer;white-space:nowrap}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.rm{border:0;background:none;font-size:.8rem;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
#logoList{max-height:50vh;overflow-y:auto}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .deal,.store{transition:transform .16s,box-shadow .16s}
  .deal:hover,.store:hover{transform:translateY(-2px);box-shadow:0 10px 22px -14px var(--c)}
  .list>*,.stores>*{animation:pop .3s both}
  .list>*:nth-child(2){animation-delay:.03s}.list>*:nth-child(3){animation-delay:.06s}.list>*:nth-child(4){animation-delay:.09s}.list>*:nth-child(5){animation-delay:.12s}
  @keyframes pop{from{transform:translateY(8px)}to{transform:none}}
  .toast{animation:up .25s both}
  @keyframes up{from{transform:translate(-50%,10px)}to{transform:translate(-50%,0)}}
}

/* instalar como app */
.instbar{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--head);color:#fff}
.instbar .ic{width:40px;height:40px;border-radius:11px;flex:none}
.instbar .tx{flex:1;min-width:0;font-size:.85rem;line-height:1.3}
.instbar .tx b{display:block;font-size:.95rem}
.instbar .btn{padding:9px 14px;font-size:.88rem}
.instbar .nx{border:0;background:none;color:rgba(255,255,255,.7);font-size:1.2rem;cursor:pointer;padding:4px 6px}
.isteps{margin:0;padding-left:22px;display:grid;gap:10px;font-size:.95rem}
.isteps .k{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:8px;background:var(--soft);font-weight:700;white-space:nowrap}
.isteps svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-3px}
</style>
</head>
<body>


<header class="hero">
  <div class="hero-in">
    <h1><span class="pc">%</span><span>Rebaja<em>.uy</em></span></h1>
    <div class="pills">
      <button class="pill loc" id="pLoc" type="button"></button>
      <button class="pill" id="pCards" type="button"></button>
    </div>
  </div>
  <div class="stripe" id="stripe" aria-hidden="true"></div>
</header>

<main class="wrap">
  <section class="view" id="vHoy" aria-label="Hoy"></section>
  <section class="view" id="vExplorar" aria-label="Explorar" hidden></section>
  <section class="view" id="vGuardados" aria-label="Guardados" hidden></section>
  <section class="view" id="vAjustes" aria-label="Ajustes" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-tab="Hoy" aria-selected="true" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Hoy</button>
    <button class="tab" role="tab" data-tab="Explorar" aria-selected="false" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Explorar</button>
    <button class="tab" role="tab" data-tab="Guardados" aria-selected="false" type="button"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Guardados</button>
    <button class="tab" role="tab" data-tab="Ajustes" aria-selected="false" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Mi perfil</button>
  </div>
</nav>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const DIAS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const CATS=["Todas","Supermercados","Gastronomía","Delivery","Combustible","Farmacias","Hogar y tecnología","Indumentaria","Compras online","Viajes y hotelería","Entretenimiento","Autos y gomerías","Ferretería y construcción","Ópticas","Mascotas","Salud y gimnasios","Educación y librerías","Transporte","Puntos y cashback","Impuestos"];
const TIPOS=["Todos","Promo del comercio","Tarjeta / banco","App","Tienda online","Evento de ofertas","Programa de beneficios"];

];

/* ---------- estado local ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mine=LS.get("rebaja_mine",[]).map(d=>({...d,com:d.com||d.ent,deptos:d.deptos||[]}));
let favs=new Set(LS.get("rebaja_favs",[]));
let myCards=new Set(LS.get("rebaja_cards",[]));
let logos=LS.get("rebaja_logos",{});
const st={tab:"Hoy",depto:LS.get("rebaja_depto","todos"),off:0,hoyCat:"Todas",showAll:false,
  ex:{q:"",cat:"Todas",com:null,tipo:"Todos",medio:"Cualquier medio",dia:"todos",zona:false,ok:false,mias:true}};
if(st.depto!=="todos"&&!DEPTOS.includes(st.depto))st.depto="todos";
const hoy=new Date().getDay();
const DIAS_L=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const GENERIC_PAY=["Cualquier medio de pago","Cualquier medio","Débito (cualquier banco)"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- colores y distintivos ---------- */
const COL={"Supermercados":["#f2542d","#fff"],"Gastronomía":["#e23a8a","#fff"],"Delivery":["#ff9f1c","#1a1530"],"Combustible":["#2b59ff","#fff"],"Farmacias":["#00a88f","#fff"],"Hogar y tecnología":["#7a3cff","#fff"],"Indumentaria":["#ff6fb5","#1a1530"],"Compras online":["#ffd23f","#1a1530"],"Viajes y hotelería":["#00b4d8","#1a1530"],"Entretenimiento":["#8ac926","#1a1530"],"Puntos y cashback":["#3d348b","#fff"],"Impuestos":["#577590","#fff"],"Autos y gomerías":["#1d3557","#fff"],"Ferretería y construcción":["#bc6c25","#fff"],"Ópticas":["#06d6a0","#1a1530"],"Mascotas":["#c77dff","#1a1530"],"Salud y gimnasios":["#118ab2","#fff"],"Educación y librerías":["#e9c46a","#1a1530"],"Transporte":["#264653","#fff"]};
const PAL=Object.values(COL);
const cv=cat=>{const c=COL[cat]||["#1a1530","#fff"];return `--c:${c[0]};--ci:${c[1]}`};
const hv=name=>{let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;const c=PAL[h%PAL.length];return `--c:${c[0]};--ci:${c[1]}`};
const comCat=(n,f)=>COMS[n]?.cat||f;
const initials=n=>String(n).replace(/[()]/g,"").split(/[\s\/-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function mono(name,cls="",style=""){
  if(logos[name])return `<span class="mono img ${cls}"><img src="${logos[name]}" alt=""></span>`;
  return `<span class="mono ${cls}" style="${style||hv(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
}
$("stripe").innerHTML=PAL.map(c=>`<i style="background:${c[0]}"></i>`).join("");

/* ---------- reglas de negocio ---------- */
const HOY_ISO=(()=>{const n=new Date();return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10)})();
const vigente=d=>!d.hasta||d.hasta>=HOY_ISO;
const diasRest=d=>d.hasta?Math.round((new Date(d.hasta+"T00:00:00")-new Date(HOY_ISO+"T00:00:00"))/864e5):null;
const fechaCorta=iso=>{const [y,m,dd]=iso.split("-");return `${+dd}/${+m}`};
function expTag(d){const r=diasRest(d);if(r==null||r>5)return "";return `<span class="tag exp">${r<=0?"Último día":r===1?"Vence mañana":`Vence en ${r} días`}</span>`}
const all=()=>[...mine,...BASE].filter(vigente);
const validOn=(d,day)=>!d.dias||!d.dias.length||d.dias.includes(day);
const inZone=d=>st.depto==="todos"||!d.deptos||!d.deptos.length||d.deptos.includes(st.depto);
const isLocal=d=>st.depto!=="todos"&&d.deptos&&d.deptos.includes(st.depto);
const usable=d=>!myCards.size||myCards.has(d.medio)||GENERIC_PAY.includes(d.medio);
const score=d=>(d.pct||6)*(d.verif||d.mio?1:.55)+(isLocal(d)?6:0)+(d.mio?3:0);
const byScore=(a,b)=>score(b)-score(a);
function where(d){
  if(d.deptos&&d.deptos.length)return {k:"zone",t:d.deptos.length>2?`${d.deptos.slice(0,2).join(", ")} y ${d.deptos.length-2} más`:"Solo en "+d.deptos.join(" y ")};
  if(COMS[d.com]?.alc==="locales")return {k:"",t:"Según sucursal"};
  return {k:"",t:"Todo el país"};
}
const daysTxt=d=>!d.dias||!d.dias.length?"Todos los días":d.dias.length===5&&[1,2,3,4,5].every(x=>d.dias.includes(x))?"Lunes a viernes":d.dias.map(i=>DIAS_L[i]).join(", ").replace(/^./,c=>c.toUpperCase());
const statusTag=d=>d.mio?`<span class="tag mine">Agregado por vos</span>`:d.verif?`<span class="tag ok">Confirmado</span>`:`<span class="tag chk">Confirmar antes de ir</span>`;
function pcBlock(d){
  if(d.pct==null||d.pct==="")return `<b class="sm">Ver<br>detalle</b>`;
  const lbl=d.tipo==="Evento de ofertas"?"hasta":d.cat==="Puntos y cashback"?"vuelve":d.cat==="Impuestos"?"menos IVA":"de descuento";
  return `<b>${d.pct}%</b><small>${lbl}</small>`;
}
function dealCard(d,day){
  const today=validOn(d,day??hoy)&&(day==null||day===hoy);
  const w=where(d);
  return `<button type="button" class="deal" data-deal="${esc(d.id)}" style="${cv(d.cat)}">
    <span class="pc">${pcBlock(d)}</span>
    <span class="bd">
      <span class="top">${mono(d.com,"",cv(comCat(d.com,d.cat)))}<span><span class="h3">${esc(d.tit)}</span><span class="who">${esc(d.com)} · ${esc(d.medio==="Cualquier medio de pago"?"Cualquier medio":d.medio)}</span></span></span>
      <span class="meta">${today?'<span class="tag hoy">Vale hoy</span>':`<span class="tag">${esc(daysTxt(d))}</span>`}<span class="tag ${w.k}">${esc(w.t)}</span>${expTag(d)}${statusTag(d)}${favs.has(d.id)?'<span class="tag">★ Guardado</span>':""}</span>
    </span></button>`;
}
const findDeal=id=>all().find(d=>d.id===id);

/* ---------- cabecera ---------- */
function renderPills(){
  $("pLoc").textContent=st.depto==="todos"?"Todo Uruguay ▾":st.depto+" ▾";
  $("pCards").textContent=myCards.size?`Mis tarjetas (${myCards.size})`:"Mis tarjetas";
}
$("pLoc").addEventListener("click",()=>openDepto());
$("pCards").addEventListener("click",()=>openCards());

/* ---------- pestaña Hoy ---------- */
function renderHoy(){
  const day=(hoy+st.off)%7;
  const strip=[...Array(7)].map((_,i)=>{const dd=(hoy+i)%7;const n=all().filter(d=>inZone(d)&&validOn(d,dd)&&usable(d)).length;
    return `<button type="button" class="day" data-off="${i}" aria-pressed="${i===st.off}"><b>${i===0?"Hoy":i===1?"Mañana":DIAS_L[dd].slice(0,3).replace(/^./,c=>c.toUpperCase())}</b><small>${n} promos</small></button>`}).join("");
  const base=all().filter(d=>inZone(d)&&validOn(d,day));
  const yours=base.filter(usable),others=base.filter(d=>!usable(d));
  const cats={};yours.forEach(d=>cats[d.cat]=(cats[d.cat]||0)+1);
  if(st.hoyCat!=="Todas"&&!cats[st.hoyCat])st.hoyCat="Todas";
  const catChips=`<button type="button" class="chip" data-hcat="Todas" aria-pressed="${st.hoyCat==="Todas"}">Todo <span class="n">${yours.length}</span></button>`+
    Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).map(c=>`<button type="button" class="chip" data-hcat="${esc(c)}" style="${cv(c)}" aria-pressed="${st.hoyCat===c}"><span class="dot"></span>${esc(c)} <span class="n">${cats[c]}</span></button>`).join("");
  const list=yours.filter(d=>st.hoyCat==="Todas"||d.cat===st.hoyCat).sort(byScore);
  const shown=st.showAll?list:list.slice(0,8);
  const local=yours.filter(isLocal).length;
  const dayName=st.off===0?`Hoy ${DIAS_L[day]}`:st.off===1?`Mañana ${DIAS_L[day]}`:`El ${DIAS_L[day]}`;
  const place=st.depto==="todos"?"todo Uruguay":st.depto;
  let h=`<div class="days" role="group" aria-label="Elegí el día">${strip}</div>
    <h2 class="greet">${esc(dayName)} en <em>${esc(place)}</em></h2>
    <p class="sub">${yours.length} ${yours.length===1?"descuento":"descuentos"} ${myCards.size?"que podés usar con lo que tenés":"para usar"}${local?` · ${local} ${local===1?"es":"son"} solo de tu zona`:""}.</p>
    <div class="chips" role="group" aria-label="Rubros">${catChips}</div>
    <div class="sec"><h2>${st.hoyCat==="Todas"?"Lo mejor del día":esc(st.hoyCat)}</h2><span>De mayor a menor ahorro</span></div>`;
  h+=shown.length?`<div class="list">${shown.map(d=>dealCard(d,day)).join("")}</div>`:`<div class="empty">No hay descuentos para este día con tus filtros.<br>Probá otro día o mirá en Explorar.</div>`;
  if(list.length>shown.length)h+=`<button type="button" class="more" id="moreBtn">Ver los ${list.length} descuentos</button>`;
  if(!myCards.size)h+=`<div class="callout"><b>Mostrá solo lo que podés usar</b><span>Contanos qué tarjetas y apps tenés y ordenamos el día para vos. No pedimos números de tarjeta.</span><button type="button" class="linkbtn" data-open="cards">Elegir mis tarjetas →</button></div>`;
  else if(others.length){
    const top=others.sort(byScore).slice(0,3);
    h+=`<div class="sec"><h2>Con otras tarjetas</h2><span>${others.length} más este día</span></div><div class="list">${top.map(d=>dealCard(d,day)).join("")}</div>`;
  }
  if(st.depto==="todos")h+=`<div class="callout"><b>¿Dónde estás?</b><span>Elegí tu departamento para ver también los descuentos de tu zona, como los de frontera o del interior.</span><button type="button" class="linkbtn" data-open="depto">Elegir departamento →</button></div>`;
  $("vHoy").innerHTML=installBar()+h;
}
$("vHoy").addEventListener("click",e=>{
  const dy=e.target.closest("[data-off]");if(dy){st.off=+dy.dataset.off;st.showAll=false;renderHoy();return}
  const c=e.target.closest("[data-hcat]");if(c){st.hoyCat=c.dataset.hcat;st.showAll=false;renderHoy();return}
  if(e.target.closest("#moreBtn")){st.showAll=true;renderHoy();return}
});

/* ---------- pestaña Explorar ---------- */
const exActive=()=>{const x=st.ex;return (x.tipo!=="Todos")+(x.medio!=="Cualquier medio")+(x.dia!=="todos")+x.zona+x.ok};
function exFilter(ignoreCom){
  const x=st.ex,q=x.q.trim().toLowerCase();
  return all().filter(d=>{
    if(!inZone(d))return false;
    if(!ignoreCom&&x.com&&d.com!==x.com)return false;
    if(x.cat!=="Todas"&&d.cat!==x.cat&&comCat(d.com,"")!==x.cat)return false;
    if(x.tipo!=="Todos"&&d.tipo!==x.tipo)return false;
    if(x.medio!=="Cualquier medio"&&d.medio!==x.medio)return false;
    if(x.dia!=="todos"&&!validOn(d,+x.dia))return false;
    if(x.zona&&!isLocal(d))return false;
    if(x.ok&&!(d.verif||d.mio))return false;
    if(x.mias&&myCards.size&&!usable(d))return false;
    if(q&&!(d.com+" "+d.tit+" "+d.ent+" "+d.cat+" "+d.medio+" "+(d.cond||"")).toLowerCase().includes(q))return false;
    return true});
}
function renderExplorar(keepFocus){
  const x=st.ex;
  const cats={};exFilter(true).forEach(d=>{const c=d.cat;cats[c]=(cats[c]||0)+1});
  let h=`<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Buscá un comercio, banco o producto" value="${esc(x.q)}" aria-label="Buscar"><button type="button" class="fbtn" id="fBtn">Filtros${exActive()?`<span class="n">${exActive()}</span>`:""}</button></div>
  <div class="chips" style="margin-top:12px" role="group" aria-label="Rubros"><button type="button" class="chip" data-xcat="Todas" aria-pressed="${x.cat==="Todas"}">Todos</button>${CATS.slice(1).filter(c=>cats[c]).map(c=>`<button type="button" class="chip" data-xcat="${esc(c)}" style="${cv(c)}" aria-pressed="${x.cat===c}"><span class="dot"></span>${esc(c)} <span class="n">${cats[c]}</span></button>`).join("")}</div>`;
  if(myCards.size)h+=`<p class="sub" style="margin-top:4px">${x.mias?`Mostrando solo lo que podés usar con tus tarjetas. <button type="button" class="linkbtn" data-mias="0">Ver todo</button>`:`Mostrando todos los medios de pago. <button type="button" class="linkbtn" data-mias="1">Solo mis tarjetas</button>`}</p>`;
  const browsing=!x.q.trim()&&!x.com&&!exActive();
  if(x.com){
    const r=exFilter(false).sort(byScore),cat=comCat(x.com,r[0]?.cat);
    h+=`<div style="margin-top:10px"><button type="button" class="back" data-com="">← Todos los comercios</button><div class="shophead" style="${cv(cat)}">${mono(x.com,"lg",cv(cat))}<span><b>${esc(x.com)}</b><small>${esc(cat)} · ${r.length} ${r.length===1?"descuento":"descuentos"}</small></span>${COMS[x.com]?.url?`<a href="${esc(COMS[x.com].url)}" target="_blank" rel="noopener">Ir al sitio ↗</a>`:""}</div>
      ${r.length?`<div class="list">${r.map(d=>dealCard(d)).join("")}</div>`:`<div class="empty">No hay descuentos de este comercio con tus filtros.</div>`}</div>`;
  }else if(browsing){
    const g={};exFilter(true).forEach(d=>(g[d.com]=g[d.com]||[]).push(d));
    const names=Object.keys(g).sort((a,b)=>Math.max(0,...g[b].map(d=>d.pct||0))-Math.max(0,...g[a].map(d=>d.pct||0)));
    h+=`<div class="sec"><h2>Comercios</h2><span>${names.length} con descuentos</span></div>`;
    h+=names.length?`<div class="stores">${names.map(n=>{const ds=g[n],best=Math.max(0,...ds.map(d=>d.pct||0)),nh=ds.filter(d=>validOn(d,hoy)).length,cat=comCat(n,ds[0].cat);
      return `<button type="button" class="store" data-com="${esc(n)}" style="${cv(cat)}"><span class="row">${mono(n,"",cv(cat))}<span><b>${esc(n)}</b><small>${esc(cat)}</small></span></span><span class="ft"><span>${ds.length} ${ds.length===1?"promo":"promos"}${nh?` · ${nh} hoy`:""}</span>${best?`<span class="best">${best}%</span>`:""}</span></button>`}).join("")}</div>`:`<div class="empty">No hay comercios con estos filtros.</div>`;
  }else{
    const r=exFilter(false).sort(byScore);
    h+=`<div class="sec"><h2>Resultados</h2><span>${r.length} ${r.length===1?"descuento":"descuentos"}</span></div>`;
    h+=r.length?`<div class="list">${r.map(d=>dealCard(d)).join("")}</div>`:`<div class="empty">No encontramos descuentos.<br>Probá con otra palabra o quitá filtros.</div>`;
  }
  $("vExplorar").innerHTML=h;
  if(keepFocus){const i=$("q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
$("vExplorar").addEventListener("input",e=>{if(e.target.id==="q"){st.ex.q=e.target.value;st.ex.com=null;renderExplorar(true)}});
$("vExplorar").addEventListener("click",e=>{
  const c=e.target.closest("[data-xcat]");if(c){st.ex.cat=c.dataset.xcat;st.ex.com=null;renderExplorar();return}
  const s=e.target.closest("[data-com]");if(s){st.ex.com=s.dataset.com||null;renderExplorar();window.scrollTo({top:0});return}
  const m=e.target.closest("[data-mias]");if(m){st.ex.mias=m.dataset.mias==="1";renderExplorar();return}
  if(e.target.closest("#fBtn"))openFilters();
});

/* ---------- pestaña Guardados ---------- */
function renderGuardados(){
  const f=all().filter(d=>favs.has(d.id)).sort(byScore);

  h+=f.length?`<div class="list">${f.map(d=>dealCard(d)).join("")}</div>`:`<div class="empty">Todavía no guardaste descuentos.<br>Abrí uno y tocá <b>Guardar</b>.</div>`;
  h+=`<div class="sec"><h2>Agregados por vos</h2><span>${mine.length}</span></div>`;

}

/* ---------- navegación ---------- */
function setTab(t){
  st.tab=t;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["Hoy","Explorar","Guardados","Ajustes"].forEach(v=>$("v"+v).hidden=v!==t);
  renderAll();window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function renderAll(){renderPills();({Hoy:renderHoy,Explorar:renderExplorar,Guardados:renderGuardados,Ajustes:renderAjustes})[st.tab]()}
document.querySelector("main").addEventListener("click",e=>{const d=e.target.closest("[data-deal]");if(d)openDeal(d.dataset.deal)});

/* ---------- hojas ---------- */
const dlg=$("dlg"),sheet=$("sheet");
function openSheet(html){sheet.innerHTML=`<button type="button" class="x" data-close aria-label="Cerrar">×</button>`+html;if(!dlg.open)dlg.showModal();sheet.scrollTop=0}
function closeSheet(){if(dlg.open)dlg.close()}
dlg.addEventListener("click",e=>{if(e.target===dlg||e.target.closest("[data-close]"))closeSheet()});
dlg.addEventListener("close",()=>renderAll());
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

function openDeal(id){
  const d=findDeal(id);if(!d)return;const w=where(d);
  openSheet(`<div class="big" style="${cv(d.cat)}">${mono(d.com,"lg",cv(comCat(d.com,d.cat)))}<div>${d.pct!=null&&d.pct!==""?`<b>${d.pct}%</b>`:""}<span style="display:block">${esc(d.com)}</span></div></div>
    <h2>${esc(d.tit)}</h2>
    <div class="meta">${validOn(d,hoy)?'<span class="tag hoy">Vale hoy</span>':""}${expTag(d)}${statusTag(d)}</div>
    <dl class="facts"><dt>Cuándo</dt><dd>${esc(daysTxt(d))}${d.hasta?` · hasta el ${fechaCorta(d.hasta)}`:""}</dd><dt>Dónde</dt><dd>${esc(w.t)}</dd><dt>Cómo pagar</dt><dd>${esc(d.medio)}${d.ent&&d.ent!==d.medio?` · ${esc(d.ent)}`:""}</dd><dt>Rubro</dt><dd>${esc(d.cat)}</dd>${d.src?`<dt>Fuente</dt><dd>${esc(d.src)}</dd>`:""}</dl>
    ${d.cond?`<p class="cond">${esc(d.cond)}</p>`:""}

    ${!st.ex.com||st.ex.com!==d.com?`<button type="button" class="linkbtn" id="moreCom">Ver todos los descuentos de ${esc(d.com)} →</button>`:""}`);

  if($("delBtn"))$("delBtn").onclick=()=>{mine=mine.filter(x=>x.id!==d.id);LS.set("rebaja_mine",mine);closeSheet();toast("Descuento eliminado")};

function openLogos(){
  const coms=Object.keys(COMS).filter(n=>COMS[n].url!==""||n.indexOf("adherid")<0).filter(n=>!/adheridos|Cualquier|frontera|interior|turismo|Ciberlunes|^Entretenimiento$/.test(n)).sort((a,b)=>a.localeCompare(b));
  const meds=CARD_OPTS();let i=0;
  const row=n=>{const k=i++;return `<div class="logorow">${mono(n)}<span class="nm">${esc(n)}</span>${logos[n]?`<button type="button" class="rm" data-rm="${esc(n)}">Quitar</button>`:""}<label class="upl" for="lg${k}">${logos[n]?"Cambiar":"Subir logo"}<input type="file" id="lg${k}" accept="image/png,image/jpeg,image/svg+xml,image/webp" data-logo="${esc(n)}"></label></div>`};
  openSheet(`<h2>Logos</h2><p class="lead">Subí el logo de cada marca (por ejemplo, del kit de prensa). Se guarda solo en este dispositivo. Para publicar la app con logos, pedí permiso a cada marca.</p><div id="logoList">${coms.map(row).join("")}${meds.map(row).join("")}</div>`);
  $("logoList").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f&&e.target.dataset.logo)saveLogo(e.target.dataset.logo,f)};
  $("logoList").onclick=e=>{const b=e.target.closest("[data-rm]");if(!b)return;delete logos[b.dataset.rm];LS.set("rebaja_logos",logos);openLogos()};
}
function saveLogo(name,file){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const S=128,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");const w=img.naturalWidth||S,h=img.naturalHeight||S,r=Math.min(S/w,S/h);
    x.drawImage(img,(S-w*r)/2,(S-h*r)/2,w*r,h*r);let url;try{url=c.toDataURL("image/png")}catch(e){url=fr.result}
    logos[name]=url;try{localStorage.setItem("rebaja_logos",JSON.stringify(logos));toast("Logo guardado")}catch(e){toast("Se ve el logo, pero no se pudo guardar")}openLogos()};
    img.onerror=()=>toast("No se pudo leer esa imagen");img.src=fr.result};fr.readAsDataURL(file);
}

/* ---------- instalar como app ---------- */
var instPrompt=null;
function isApp(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}
function plat(){
  const ua=navigator.userAgent||"";
  const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(ios)return /CriOS|FxiOS|EdgiOS/.test(ua)?"ios-otro":"ios";
  if(/Android/.test(ua))return "android";
  if(/Macintosh/.test(ua)&&/Safari/.test(ua)&&!/Chrome|Chromium|Edg|Firefox/.test(ua))return "mac-safari";
  if(/Firefox/.test(ua))return "firefox";
  return "pc";
}
function instHidden(){const t=LS.get("rebaja_inst_x",0);return t&&Date.now()-t<14*864e5}
function installBar(){
  if(isApp()||instHidden())return "";
  const p=plat();if(p==="firefox"&&!instPrompt)return "";
  const movil=/^(ios|ios-otro|android)$/.test(p);
  return `<div class="instbar"><img class="ic" src="icon-192.png" alt=""><div class="tx"><b>Tené Rebaja.uy como app</b>${movil?"Gratis, en tu pantalla de inicio.":"Abrila con un clic, en su propia ventana."}</div><button type="button" class="btn" data-open="install">Instalar</button><button type="button" class="nx" data-instx aria-label="Ahora no">×</button></div>`;
}
const SH=`<svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>`;
const DOTS=`<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>`;
async function openInstall(){
  if(isApp()){toast("Ya la estás usando como app");return}
  if(instPrompt){
    const ev=instPrompt;instPrompt=null;
    try{ev.prompt();const r=await ev.userChoice;if(r&&r.outcome==="accepted")toast("¡Listo! Rebaja.uy quedó instalada")}catch(e){}
    renderAll();return;
  }
  const p=plat();let pasos,nota="";
  if(p==="ios")pasos=[`Tocá el botón <span class="k">${SH} Compartir</span> abajo de la pantalla (en iPad, arriba a la derecha). Si no lo ves, tocá primero <span class="k">···</span>.`,`Deslizá y elegí <span class="k">Agregar a inicio</span>.`,`Tocá <span class="k">Agregar</span>. El ícono de Rebaja.uy aparece junto a tus apps.`];
  else if(p==="ios-otro")pasos=[`Tocá el botón <span class="k">${SH} Compartir</span> del navegador.`,`Elegí <span class="k">Agregar a inicio</span>.`,`Tocá <span class="k">Agregar</span>.`],nota="Si no aparece la opción, abrí rebajauy.github.io en Safari y hacelo desde ahí.";
  else if(p==="android")pasos=[`Tocá el menú <span class="k">${DOTS}</span> arriba a la derecha.`,`Elegí <span class="k">Instalar app</span> o <span class="k">Agregar a la pantalla principal</span>.`,`Confirmá con <span class="k">Instalar</span>.`];
  else if(p==="mac-safari")pasos=[`En la barra de arriba, abrí el menú <span class="k">Archivo</span>.`,`Elegí <span class="k">Agregar al Dock</span>.`,`Tocá <span class="k">Agregar</span>. La vas a encontrar en el Dock y en Aplicaciones.`];
  else if(p==="firefox")pasos=[`Firefox no instala apps web en la computadora.`,`Guardala en favoritos con <span class="k">Ctrl + D</span> (o <span class="k">⌘ + D</span> en Mac).`],nota="Para tenerla como app, abrila en Chrome o Edge.";
  else pasos=[`Buscá el ícono de instalar <span class="k">⊕</span> a la derecha de la barra de direcciones.`,`O abrí el menú <span class="k">${DOTS}</span> → <span class="k">Transmitir, guardar y compartir</span> → <span class="k">Instalar página como app</span>.`,`Confirmá con <span class="k">Instalar</span>.`];
  openSheet(`<h2>Instalar Rebaja.uy</h2><p class="lead">Es gratis, no ocupa casi espacio y se actualiza sola.</p><ol class="isteps">${pasos.map(x=>`<li>${x}</li>`).join("")}</ol>${nota?`<p class="lead">${nota}</p>`:""}<button type="button" class="btn ghost" data-close>Entendido</button>`);
}
